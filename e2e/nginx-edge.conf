events {}
http {
    map $http_authorization $proof_present { default 0; "~^DerpersProof " 1; }
    log_format evidence escape=json '{"tier":"edge","method":"$request_method","path":"$uri","status":$status,"upstream_status":"$upstream_status","scheme":"$scheme","proof_present":$proof_present,"cache_control":"$sent_http_cache_control"}';
    access_log /dev/stdout evidence;
    error_log /dev/stderr warn;
    large_client_header_buffers 4 16k;
    client_max_body_size 1m;
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        ssl_certificate /certs/controller.e2e.test.crt;
        ssl_certificate_key /certs/controller.e2e.test.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /metrics { return 403; }
        location / {
            resolver 127.0.0.11 valid=1s ipv6=on;
            set $backend http://origin:8080;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_redirect off;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            add_header Cache-Control "no-store" always;
        }
    }
}

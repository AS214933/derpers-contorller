services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: derpers
      POSTGRES_PASSWORD: e2e-only
      POSTGRES_DB: derpers
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U derpers -d derpers"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [test]
  controller:
    image: derpers-controller:${IMAGE_TAG}
    environment:
      DATABASE_URL: postgres://derpers:e2e-only@postgres:5432/derpers?sslmode=disable
      MASTER_KEY: ${MASTER_KEY}
      METRICS_TOKEN: ${METRICS_TOKEN}
      CONTROLLER_URL: https://controller.e2e.test:8443
      PUBLIC_URL: https://controller.e2e.test:8443
      HTTP_ADDR: :8080
      TLS_ADDR: ""
      NODE_AUTH_MODE: proof
      NODE_IDENTITY_TTL: 5m
      NODE_CA_CERT_FILE: /certs/ca.crt
      NODE_CA_KEY_FILE: /certs/ca.key
      HEADSCALE_ALLOWED_CIDRS: 172.30.0.0/16,fd30:de::/64
      SSL_CERT_FILE: /certs/ca.crt
    volumes:
      - ${E2E_WORK}/certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [test]
  origin:
    image: ${NGINX_IMAGE}
    volumes:
      - ./nginx-origin.conf:/etc/nginx/nginx.conf:ro
    depends_on: [controller]
    networks: [test]
  edge:
    image: ${NGINX_IMAGE}
    volumes:
      - ./nginx-edge.conf:/etc/nginx/nginx.conf:ro
      - ${E2E_WORK}/certs:/certs:ro
    depends_on: [origin]
    networks:
      test:
        aliases: [controller.e2e.test]
  agent:
    profiles: [agent]
    image: derpers-agent:${IMAGE_TAG}
    environment:
      CONTROLLER_URL: https://controller.e2e.test:8443
      CONTROLLER_CA_FILE: /certs/ca.crt
      ENROLLMENT_TOKEN: ${ENROLLMENT_TOKEN:-}
      NODE_ID: ${NODE_ID:-}
      CONFIG_DIR: /node
      STATE_DIR: /var/lib/derpers-agent
      HOST_CONFIG_DIR: ${E2E_WORK}/node
      HOST_STATE_DIR: ${E2E_WORK}/agent-state
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_test
      DERPER_CONTAINER: ${COMPOSE_PROJECT_NAME}-derper
      CADDY_CONTAINER: ${COMPOSE_PROJECT_NAME}-caddy
      MANAGE_CONTAINERS: "true"
      PUBLISH_NODE_PORTS: "false"
      POLL_INTERVAL: 2s
      HEARTBEAT_INTERVAL: 2s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${E2E_WORK}/certs:/certs:ro
      - ${E2E_WORK}/node:/node
      - ${E2E_WORK}/agent-state:/var/lib/derpers-agent
    networks: [test]
  headscale:
    profiles: [headscale]
    image: ${HEADSCALE_IMAGE}
    command: serve
    volumes:
      - ${E2E_WORK}/headscale:/etc/headscale:ro
      - ${E2E_WORK}/certs:/certs:ro
      - headscale-state:/var/lib/headscale
      - headscale-run:/var/run/headscale
    networks:
      test:
        aliases: [headscale.e2e.test]
  client-a:
    profiles: [clients]
    image: derpers-e2e-client:${IMAGE_TAG}
    cap_add: [NET_ADMIN, NET_RAW]
    devices: [/dev/net/tun:/dev/net/tun]
    volumes:
      - ${E2E_WORK}/certs/ca.crt:/certs/ca.crt:ro
      - client-a-state:/var/lib/tailscale
    networks: [test]
  client-b:
    profiles: [clients]
    image: derpers-e2e-client:${IMAGE_TAG}
    cap_add: [NET_ADMIN, NET_RAW]
    devices: [/dev/net/tun:/dev/net/tun]
    volumes:
      - ${E2E_WORK}/certs/ca.crt:/certs/ca.crt:ro
      - client-b-state:/var/lib/tailscale
    networks: [test]
networks:
  test:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
        - subnet: fd30:de::/64
volumes:
  headscale-state:
  headscale-run:
  client-a-state:
  client-b-state:

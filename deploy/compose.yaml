services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: derpers
      POSTGRES_DB: derpers
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/bootstrap.sh first}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U derpers -d derpers"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [private]
  controller:
    image: ${CONTROLLER_IMAGE:-ghcr.io/as214933/derpers-contorller-controller:${IMAGE_VERSION:-v0.2.0}}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://derpers:${POSTGRES_PASSWORD}@postgres:5432/derpers?sslmode=disable
      MASTER_KEY: ${MASTER_KEY:?run deploy/bootstrap.sh first}
      METRICS_TOKEN: ${METRICS_TOKEN:?run deploy/bootstrap.sh first}
      CONTROLLER_URL: ${CONTROLLER_URL:-https://controller.example.com}
      HTTP_ADDR: :8080
      TLS_ADDR: ""
      NODE_AUTH_MODE: ${NODE_AUTH_MODE:-proof}
      NODE_CA_CERT_FILE: /certs/node-ca.crt
      NODE_CA_KEY_FILE: /certs/node-ca.key
      HEADSCALE_ALLOWED_CIDRS: ${HEADSCALE_ALLOWED_CIDRS:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid,profile,email,groups}
      OIDC_ADMIN_GROUPS: ${OIDC_ADMIN_GROUPS:-derpers-admin}
      PUBLIC_URL: ${PUBLIC_URL:-https://controller.example.com}
      GRAFANA_URL: ${GRAFANA_URL:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-}
      DERPER_IMAGE: ${DERPER_IMAGE:-ghcr.io/as214933/derpers-contorller-derper:${IMAGE_VERSION:-v0.2.0}}
      AGENT_IMAGE: ${AGENT_IMAGE:-ghcr.io/as214933/derpers-contorller-agent:${IMAGE_VERSION:-v0.2.0}}
      CADDY_IMAGE: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
      ACME_EMAIL: ${ACME_EMAIL:-}
      ACME_DIRECTORY: ${ACME_DIRECTORY:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      - ./secrets:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8080/readyz]
      interval: 10s
      timeout: 5s
      retries: 5
  origin:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    volumes:
      - ./nginx-origin.conf:/etc/nginx/nginx.conf:ro
    ports:
      - ${ORIGIN_BIND:-127.0.0.1}:${ORIGIN_PORT:-8080}:8080
    depends_on:
      controller:
        condition: service_healthy
    networks: [private]
networks:
  private:
volumes:
  postgres:

# EdgeOne HTTPS -> this HTTP origin -> HTTP-only controller.
# Replace controller.example.com with the public CONTROLLER_URL host.
events {}
http {
    # Do not log query strings, cookies, Authorization or request bodies.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    error_log /dev/stderr crit;
    large_client_header_buffers 4 16k;
    client_max_body_size 1m;
    server {
        listen 8080 default_server;
        server_name _;
        return 444;
    }
    server {
        listen 8080;
        server_name controller.example.com;
        # Prometheus scrapes controller:8080 privately, never via EdgeOne.
        location = /metrics { return 403; }
        location ^~ /debug/ { return 403; }
        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $controller http://controller:8080;
            proxy_pass $controller;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header Authorization $http_authorization;
            # Set these at the trusted origin; never use forwarded certificate headers.
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache off;
            proxy_next_upstream off;
            proxy_redirect off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            add_header Cache-Control "no-store" always;
        }
    }
}

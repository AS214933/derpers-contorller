# Include this server block in the host Nginx http{} when EdgeOne uses public origin IPs.
# Compose origin remains bound to 127.0.0.1:8080. Use a valid origin server certificate;
# configure EdgeOne HTTPS origin, certificate verification and this TLS SNI/Host.
server {
    listen 443 ssl;
    server_name controller.example.com;
    ssl_certificate /etc/nginx/certs/origin-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    large_client_header_buffers 4 16k;
    client_max_body_size 1m;
    # This protects OIDC query parameters and request signatures from default logs.
    access_log off;
    error_log /var/log/nginx/error.log crit;
    location = /metrics { return 403; }
    location ^~ /debug/ { return 403; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache off;
        proxy_next_upstream off;
        proxy_redirect off;
        add_header Cache-Control "no-store" always;
    }
}

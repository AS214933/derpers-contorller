name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: derpers
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: derpers_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U derpers -d derpers_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://derpers:integration-only@127.0.0.1:5432/derpers_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go checks
        run: |
          test -z "$(gofmt -l cmd internal tools e2e/derp-probe)"
          go vet ./...
          go test -race ./...
      - name: Web checks
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build
      - name: Script checks
        run: |
          bash -n e2e/build-images.sh e2e/run.sh e2e/publish.sh deploy/bootstrap.sh
          sh -n e2e/client-entrypoint.sh
          shellcheck -x -e SC1091 e2e/*.sh deploy/*.sh
          node --test e2e/version.test.mjs
      - name: Deployment and monitoring validation
        env:
          POSTGRES_PASSWORD: ci-configuration-validation
          MASTER_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          GRAFANA_ADMIN_PASSWORD: ci-configuration-validation
          E2E_WORK: /tmp/derpers-configuration-validation
          COMPOSE_PROJECT_NAME: derpers-configuration-validation
          IMAGE_TAG: ci-validation
          CONTROLLER_URL: https://controller.example.test:8443
          NODE_ID: ci-validation
          ENROLLMENT_TOKEN: ci-validation
          HOST_CONFIG_DIR: /tmp/derpers-configuration-validation/node
          HOST_STATE_DIR: /tmp/derpers-configuration-validation/agent
        run: |
          set -a
          source deploy/images.env
          set +a
          docker compose -f deploy/compose.yaml -f deploy/monitoring-compose.yaml config --quiet
          docker compose -f deploy/node-compose.yaml config --quiet
          docker compose -f e2e/compose.yaml config --quiet
          docker run --rm --entrypoint /bin/promtool -v "$PWD/deploy:/etc/prometheus:ro" "$PROMETHEUS_IMAGE" check config /etc/prometheus/prometheus.yml
          node -e 'JSON.parse(require("fs").readFileSync("deploy/grafana/dashboards/derpers.json","utf8"))'
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build once on native architecture
        env:
          IMAGE_TAG: ${{ github.sha }}-${{ matrix.arch }}
          IMAGE_ARCHIVE: images-${{ matrix.arch }}.tar
        run: bash e2e/build-images.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: images-${{ matrix.arch }}
          path: images-${{ matrix.arch }}.tar
          compression-level: 0
          retention-days: 7
  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      use_artifacts: true
  publish:
    needs: [quality, build, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write
      actions: read
